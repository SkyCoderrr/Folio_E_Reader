[package]
name = "e-reader"
version = "1.0.0-rc.1"
edition = "2024"

[lib]
name = "e_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-runtime = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
blake3 = "1"
fancy-regex = "0.20"
walkdir = "2"
fontdb = "0.23"
ttf-parser = "0.25"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
encoding_rs = "0.8"
chardetng = "0.1"
chrono = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }
webview2-com = "0.39"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
